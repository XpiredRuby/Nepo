name: Job Alert Watchdog

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    paths:
      - 'heartbeats/**'
      - '.github/workflows/job-alert-watchdog.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check heartbeat freshness and manage alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          threshold_minutes = 85
          repo = os.environ['REPO']
          owner = os.environ['OWNER']
          token = os.environ['GH_TOKEN']

          alerts = {
              'Fall 2026': 'heartbeats/fall_2026.txt',
              'Spring 2027': 'heartbeats/spring_2027.txt',
              'Summer/Fall 2027': 'heartbeats/summer_fall_2027.txt',
          }

          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'job-alert-watchdog',
          }

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              with urllib.request.urlopen(req) as response:
                  raw = response.read().decode()
                  return json.loads(raw) if raw else None

          open_issues = request('GET', f'{api}/issues?state=open&per_page=100')
          issues_by_title = {item['title']: item for item in open_issues if 'pull_request' not in item}
          now = datetime.now(timezone.utc)

          for name, filename in alerts.items():
              title = f'[WATCHDOG] {name} job alert missed'
              path = Path(filename)
              stale = True
              detail = 'Heartbeat file is missing.'

              if path.exists():
                  raw = path.read_text().strip()
                  try:
                      last = datetime.fromisoformat(raw.replace('Z', '+00:00'))
                      age = (now - last).total_seconds() / 60
                      stale = age > threshold_minutes
                      detail = f'Last successful heartbeat: {last.isoformat()} (age {age:.1f} minutes).'
                  except Exception as exc:
                      detail = f'Heartbeat could not be parsed: {raw!r}. Error: {exc}'

              existing = issues_by_title.get(title)

              if stale and existing is None:
                  body = (
                      f'The **{name}** ChatGPT job-alert heartbeat is stale.\n\n'
                      f'{detail}\n\n'
                      f'The watchdog threshold is {threshold_minutes} minutes. '
                      'Check the ChatGPT scheduled task and Gmail delivery.'
                  )
                  request('POST', f'{api}/issues', {
                      'title': title,
                      'body': body,
                      'assignees': [owner],
                  })
                  print(f'ALERT OPENED: {name} — {detail}')
              elif not stale and existing is not None:
                  request('PATCH', f"{api}/issues/{existing['number']}", {
                      'state': 'closed',
                      'state_reason': 'completed',
                  })
                  print(f'RECOVERED: {name} — closed issue #{existing["number"]}')
              else:
                  print(f'OK: {name} — {detail}')
          PY
